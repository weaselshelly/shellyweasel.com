<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelly Weasel — Coming Soon</title>
  <meta name="description" content="The art portfolio of Shelly Weasel. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f0eb;
      --ink: #0d0d0d;
      --muted: #77746e;
      --line: #0d0d0d;
      --soft: rgba(13, 13, 13, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d0d0d;
        --ink: #f2f0eb;
        --muted: #8a8780;
        --line: #f2f0eb;
        --soft: rgba(242, 240, 235, 0.2);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d0d0d;
      --ink: #f2f0eb;
      --muted: #8a8780;
      --line: #f2f0eb;
      --soft: rgba(242, 240, 235, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter Tight", system-ui, sans-serif;
      font-size: 14px;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 36px);
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.14em;
    }
    header {
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    header .mark { font-weight: 500; }
    .muted { color: var(--muted); }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: clamp(40px, 8vh, 96px) 0;
    }

    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-bottom: clamp(12px, 2vh, 24px);
    }

    h1 {
      font-family: "Instrument Serif", Helvetica, serif;
      font-weight: 400;
      font-size: clamp(64px, 17vw, 300px);
      line-height: 0.84;
      letter-spacing: -0.035em;
    }
    h1 .line { display: block; }
    h1 em { font-style: italic; padding-left: 0.6em; }

    .sub {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-top: clamp(20px, 4vh, 48px);
      padding-top: 18px;
      border-top: 1px solid var(--soft);
    }
    .sub p { max-width: 34ch; line-height: 1.5; font-size: 15px; }

    .disciplines {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 28px;
      padding: 12px 0;
      margin-bottom: 18px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 20px;
      font-style: italic;
    }

    .works {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 1.2vw, 16px);
      margin-top: clamp(24px, 5vh, 56px);
    }
    .works figure { aspect-ratio: 4 / 5; overflow: hidden; background: var(--soft); }
    .works img { width: 100%; height: 100%; object-fit: cover; display: block; }

    footer a { color: inherit; text-decoration: none; }
    footer a:hover { text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 640px) {
      h1 em { padding-left: 0.25em; }
      header .hide-sm { display: none; }
      .works { grid-template-columns: repeat(2, 1fr); }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="mark">Shelly Weasel</span>
      <span class="muted hide-sm">Portfolio</span>
      <span>In progress</span>
    </header>

    <main>
      <div class="eyebrow muted">Portfolio — Vol. 01</div>
      <h1>
        <span class="line">Coming</span>
        <span class="line"><em>soon.</em></span>
      </h1>
      <div class="sub">
        <p>A new home for my work is taking shape.</p>
      </div>
      <!-- Drop your images into the images/ folder with these names -->
      <div class="works">
        <figure><img src="images/work-1.jpg" alt="Charcoal portrait of a man looking upward" onerror="this.remove()"></figure>
        <figure><img src="images/work-2.jpg" alt="Grayscale gouache value study of a teapot and cup" onerror="this.remove()"></figure>
        <figure><img src="images/work-3.jpg" alt="Charcoal portrait of a man in three-quarter view" onerror="this.remove()"></figure>
        <figure><img src="images/work-4.jpg" alt="Gouache study of a silver spoon on yellow" onerror="this.remove()"></figure>
      </div>
    </main>

    <div>
      <div class="disciplines">
        <span>Charcoal portraiture</span><span>Gouache</span><span>Still life</span><span>Studio notes</span>
      </div>
      <footer>
        <span class="muted">© <span id="year"></span> Shelly Weasel</span>
        <span><a href="https://www.instagram.com/shelly_weasel/" target="_blank" rel="noopener">Instagram</a> &nbsp;/&nbsp; <a href="mailto:hello@example.com">Email</a></span>
      </footer>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
